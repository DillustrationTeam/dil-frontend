name: 🎨 Frontend CI — Build & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-lint:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint

      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5075/api/v1

      - name: ✅ Build passed
        run: echo "Frontend build succeeded!"
