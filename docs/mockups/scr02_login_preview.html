<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 11 - SCR-02 User Authentication Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --color-primary: #A7ACD9;
      --color-secondary: #78767A;
      --color-tertiary: #C6AC6D;
      --color-neutral: #78767A;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: radial-gradient(circle at 50% 30%, #252A40 0%, #161826 100%);
      color: #e4e1e5;
    }

    h1,
    h2,
    h3,
    .font-h1 {
      font-family: 'Sora', sans-serif;
    }

    .glass-card {
      background: rgba(30, 34, 52, 0.7);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
    }

    .input-field {
      background: rgba(16, 18, 28, 0.7);
      border: 1px solid rgba(120, 118, 122, 0.3);
      transition: all 0.2s ease-in-out;
    }

    .input-field:focus-within {
      border-color: #A7ACD9;
      box-shadow: 0 0 14px rgba(167, 172, 217, 0.25);
      background: rgba(20, 23, 36, 0.85);
    }

    .btn-primary {
      background: #A7ACD9;
      color: #161826;
      box-shadow: 0 4px 20px rgba(167, 172, 217, 0.25);
      transition: all 0.2s ease-in-out;
    }

    .btn-primary:hover {
      background: #ffffff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .btn-inverted {
      background: #FFFFFF;
      color: #161826;
      transition: all 0.2s ease-in-out;
    }

    .btn-inverted:hover {
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
    }

    .badge-tertiary {
      background: rgba(198, 172, 109, 0.15);
      border: 1px solid rgba(198, 172, 109, 0.4);
      color: #C6AC6D;
    }
  </style>
</head>

<body class="min-h-screen w-full flex items-center justify-center p-6 relative overflow-hidden">

  <!-- Ambient Atmospheric Glows -->
  <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
    <div class="absolute top-[-15%] left-[-15%] w-[55%] h-[55%] bg-[#A7ACD9]/10 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[45%] h-[45%] bg-[#C6AC6D]/10 rounded-full blur-[120px]"></div>
  </div>

  <main class="w-full max-w-xl z-10">
    <!-- Header Brand Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="flex flex-col items-center gap-1.5 mb-2">
        <svg class="h-10 w-auto text-white" viewBox="0 0 48 48" fill="none">
          <path d="M24 4L28 10H20L24 4Z" fill="#A7ACD9" />
          <rect x="21" y="10" width="6" height="12" rx="2" fill="#A7ACD9" />
          <path d="M16 22H32V25C32 29.4183 28.4183 33 24 33C19.5817 33 16 29.4183 16 25V22Z" fill="white"
            fill-opacity="0.9" />
          <rect x="22.5" y="33" width="3" height="11" rx="1.5" fill="#A7ACD9" />
        </svg>
        <span class="text-3xl font-extrabold font-h1 tracking-tight text-white">dillustration</span>
      </div>
      <p class="text-[11px] text-[#78767A] uppercase tracking-[0.2em] font-medium">
        DIGITAL ETHEREALISM COLLECTIVE
      </p>
    </div>

    <!-- Glassmorphic Card Container -->
    <div class="glass-card rounded-[28px] p-8 md:p-12 relative overflow-hidden">
      <!-- Background Decorative Grid Icon -->
      <div class="absolute top-0 right-0 p-6 opacity-[0.04] pointer-events-none text-white">
        <span class="material-symbols-outlined text-9xl">grid_view</span>
      </div>

      <div class="relative z-10">
        <div class="flex items-center justify-between mb-2">
          <h1 class="font-h1 text-3xl font-bold text-white">Welcome Back</h1>
        </div>
        <p class="text-sm text-[#78767A] mb-8 leading-relaxed">
          Access your digital art gallery, active commissions & wallet.
        </p>

        <form class="space-y-5" onsubmit="event.preventDefault()">
          <!-- Email Address Input -->
          <div class="space-y-1.5">
            <label class="text-[11px] uppercase tracking-[0.12em] text-[#78767A] ml-1 font-semibold block">
              EMAIL ADDRESS
            </label>
            <div class="input-field rounded-xl flex items-center px-4 py-3 text-white">
              <span class="material-symbols-outlined text-[#78767A] text-lg mr-3">alternate_email</span>
              <input type="email" value="curator@ethereal.art"
                class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-[#78767A]"
                placeholder="artist@dillustration.art" />
            </div>
          </div>

          <!-- Password Input -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-center px-1">
              <label class="text-[11px] uppercase tracking-[0.12em] text-[#78767A] font-semibold block">
                PASSWORD
              </label>
              <a href="#" class="text-xs text-[#A7ACD9] hover:underline font-medium">Forgot Password?</a>
            </div>
            <div class="input-field rounded-xl flex items-center px-4 py-3 text-white">
              <span class="material-symbols-outlined text-[#78767A] text-lg mr-3">lock</span>
              <input type="password" value="••••••••••••"
                class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-[#78767A]"
                placeholder="••••••••••••" />
              <span
                class="material-symbols-outlined text-[#78767A] text-lg cursor-pointer hover:text-white transition-colors">visibility</span>
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="flex items-center gap-2.5 pt-1">
            <input type="checkbox" checked id="remember"
              class="rounded border-[#78767A]/40 bg-[#10121C] text-[#A7ACD9] focus:ring-[#A7ACD9] cursor-pointer" />
            <label for="remember" class="text-xs text-[#78767A] cursor-pointer select-none">
              Remember me on this device (Session active for 7 days)
            </label>
          </div>

          <!-- Primary Submit Button -->
          <button type="button"
            class="btn-primary w-full py-4 font-bold text-base rounded-xl mt-4 flex items-center justify-center gap-2 group cursor-pointer">
            <span>Sign In to Collective</span>
            <span
              class="material-symbols-outlined text-xl transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
          </button>
        </form>

        <!-- Social Login Divider -->
        <div class="mt-8 pt-6 border-t border-white/[0.08] flex flex-col items-center gap-5">
          <p class="text-xs text-[#78767A]">
            Don't have an account? <a href="#" class="text-[#A7ACD9] font-bold hover:underline">Register Now</a>
          </p>

          <div class="flex items-center gap-4 w-full">
            <div class="h-[1px] flex-grow bg-[#78767A]/30"></div>
            <span class="text-[10px] text-[#78767A] uppercase tracking-widest font-semibold">OR CONTINUE WITH</span>
            <div class="h-[1px] flex-grow bg-[#78767A]/30"></div>
          </div>

          <!-- Google & Pixiv SSO Buttons -->
          <div class="grid grid-cols-2 gap-4 w-full">
            <button type="button"
              class="flex items-center justify-center gap-3 py-3 rounded-xl bg-white/5 border border-[#78767A]/30 hover:border-[#A7ACD9] hover:bg-white/10 transition-all text-xs font-semibold text-[#e4e1e5] hover:text-white cursor-pointer">
              <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                <path fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
              </svg>
              <span>Google SSO</span>
            </button>

            <button type="button"
              class="flex items-center justify-center gap-3 py-3 rounded-xl bg-white/5 border border-[#78767A]/30 hover:border-[#0096FA] hover:bg-white/10 transition-all text-xs font-semibold text-[#e4e1e5] hover:text-[#0096FA] cursor-pointer">
              <svg class="w-4 h-4 fill-[#0096FA]" viewBox="0 0 24 24">
                <path
                  d="M12.238 2C6.609 2 2 6.609 2 12.238c0 5.63 4.609 10.238 10.238 10.238 5.63 0 10.238-4.609 10.238-10.238C22.476 6.609 17.868 2 12.238 2zm3.895 10.665c-1.127 1.551-2.903 2.502-4.697 2.502h-1.921v2.793H7.554V6.993h4.341c2.723 0 4.796 1.666 4.796 4.093 0 1.002-.276 1.956-.558 2.579z" />
              </svg>
              <span>Pixiv SSO</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Status Footer -->
    <div class="mt-8 flex justify-between items-center px-4 text-xs text-[#78767A]">
      <div class="flex items-center gap-2.5">
        <span class="w-2 h-2 rounded-full bg-[#C6AC6D] shadow-[0_0_8px_#C6AC6D]"></span>
        <span class="uppercase tracking-wider">GALLERY SERVERS ONLINE</span>
      </div>
      <div class="flex gap-6">
        <a href="#" class="hover:text-[#A7ACD9]">Privacy</a>
        <span>v2.04</span>
      </div>
    </div>
  </main>
</body>

</html>
