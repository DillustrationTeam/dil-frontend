<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 13 - SCR-03 Forgot Password Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --color-primary: #A7ACD9;
      --color-secondary: #78767A;
      --color-tertiary: #C6AC6D;
      --color-neutral: #78767A;
    }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: radial-gradient(circle at 50% 30%, #252A40 0%, #161826 100%);
      color: #e4e1e5;
    }
    h1, h2, h3, .font-h1 {
      font-family: 'Sora', sans-serif;
    }
    .glass-card {
      background: rgba(30, 34, 52, 0.7);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
    }
    .input-field {
      background: rgba(16, 18, 28, 0.7);
      border: 1px solid rgba(120, 118, 122, 0.3);
      transition: all 0.2s ease-in-out;
    }
    .input-field:focus-within {
      border-color: #A7ACD9;
      box-shadow: 0 0 14px rgba(167, 172, 217, 0.25);
      background: rgba(20, 23, 36, 0.85);
    }
    .btn-primary {
      background: #A7ACD9;
      color: #161826;
      box-shadow: 0 4px 20px rgba(167, 172, 217, 0.25);
      transition: all 0.2s ease-in-out;
    }
    .btn-primary:hover {
      background: #ffffff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between p-8 relative overflow-hidden">
  
  <!-- Ambient Atmospheric Glows -->
  <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
    <div class="absolute top-[-15%] left-[-15%] w-[55%] h-[55%] bg-[#A7ACD9]/10 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[45%] h-[45%] bg-[#C6AC6D]/10 rounded-full blur-[120px]"></div>
  </div>

  <!-- Top Page Header -->
  <header class="w-full flex justify-between items-center z-10">
    <div class="flex items-center gap-3">
      <svg class="h-8 w-auto text-white" viewBox="0 0 48 48" fill="none">
        <path d="M24 4L28 10H20L24 4Z" fill="#A7ACD9"/>
        <rect x="21" y="10" width="6" height="12" rx="2" fill="#A7ACD9"/>
        <path d="M16 22H32V25C32 29.4183 28.4183 33 24 33C19.5817 33 16 29.4183 16 25V22Z" fill="white" fill-opacity="0.9"/>
        <rect x="22.5" y="33" width="3" height="11" rx="1.5" fill="#A7ACD9"/>
      </svg>
      <span class="text-2xl font-extrabold font-h1 tracking-tight text-white">dillustration</span>
    </div>
  </header>

  <!-- Center Main Card Container -->
  <main class="w-full max-w-md mx-auto my-auto z-10 py-6">
    <div class="glass-card rounded-[28px] p-8 md:p-10 relative overflow-hidden">
      
      <!-- Icon Badge at Top of Card -->
      <div class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-6 text-white/70">
        <span class="material-symbols-outlined text-2xl">history</span>
      </div>

      <div class="relative z-10">
        <h1 class="font-h1 text-3xl font-bold text-white mb-2">Recover access</h1>
        <p class="text-sm text-[#78767A] mb-8 leading-relaxed">
          Enter the email associated with your account and we'll send a magic link to reset your password.
        </p>

        <form class="space-y-6" onsubmit="event.preventDefault()">
          <!-- Email Address Input -->
          <div class="space-y-2">
            <label class="text-[11px] uppercase tracking-[0.12em] text-[#78767A] font-semibold block">
              EMAIL ADDRESS
            </label>
            <div class="input-field rounded-xl flex items-center px-4 py-3.5 text-white">
              <input type="email" value="artist@dillustration.com" class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-[#78767A]" placeholder="artist@dillustration.com" />
            </div>
          </div>

          <!-- Primary Send Link Button -->
          <button type="button" class="btn-primary w-full py-4 font-bold text-base rounded-xl flex items-center justify-center gap-2 group cursor-pointer">
            <span>Send Link</span>
            <span class="material-symbols-outlined text-xl transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
          </button>

          <!-- Back Link -->
          <div class="text-center pt-2">
            <a href="#" class="text-xs font-semibold text-[#78767A] hover:text-white transition-colors">
              ← Return to sign in
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- Footnote below card -->
    <div class="text-center mt-6">
      <p class="text-xs text-[#78767A]">
        Having trouble? <a href="#" class="text-[#A7ACD9] hover:underline">Contact collective support</a>
      </p>
    </div>
  </main>

  <!-- Bottom Page Footer -->
  <footer class="w-full flex justify-between items-center text-xs text-[#78767A] z-10 pt-4">
    <div>
      © 2026 dillustration. Digital Etherealism Art Collective.
    </div>
    <div class="flex gap-6">
      <a href="#" class="hover:text-white">Privacy</a>
      <a href="#" class="hover:text-white">Guidelines</a>
    </div>
  </footer>

</body>
</html>
