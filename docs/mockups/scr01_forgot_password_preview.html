<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover Access - dillustration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background-color: #1F2335; color: #e4e1e5; }
    h1, h2, h3, .font-h1 { font-family: 'Sora', sans-serif; }
    .glass-container {
      background: rgba(31, 35, 53, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between p-6 md:p-8 relative overflow-hidden">

  <!-- Ambient Atmospheric Glows -->
  <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
    <div class="absolute top-[-15%] left-[-15%] w-[55%] h-[55%] bg-[#A7ACD9]/10 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[45%] h-[45%] bg-[#C6AC6D]/10 rounded-full blur-[120px]"></div>
  </div>

  <!-- Header -->
  <header class="w-full flex justify-between items-center z-10">
    <a href="scr05_marketplace_feed_preview.html">
      <span class="text-xl font-black font-h1 tracking-tight text-white">dillustration</span>
    </a>
  </header>

  <!-- Main Card -->
  <main class="w-full max-w-md mx-auto my-auto z-10 py-6">
    <div class="glass-container rounded-[28px] p-8 md:p-10 relative overflow-hidden">
      
      <!-- Icon Badge -->
      <div class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-6 text-white/70">
        <span class="material-symbols-outlined text-2xl">history</span>
      </div>

      <div class="relative z-10 space-y-6">
        <div>
          <h1 class="font-h1 text-3xl font-bold text-white mb-2">Recover Access</h1>
          <p class="text-xs text-[#8A8FA9] leading-relaxed">
            Enter the email associated with your account and we'll send a magic link to reset your password.
          </p>
        </div>

        <form onsubmit="handleSendLink(event)" class="space-y-6">
          <div class="space-y-2">
            <label class="text-[11px] uppercase tracking-widest text-[#8A8FA9] font-semibold block ml-1">
              EMAIL ADDRESS
            </label>
            <div class="rounded-xl flex items-center px-4 py-3.5 text-white bg-[#0e0e11]/50 border border-white/10">
              <input
                id="resetEmail"
                type="email"
                required
                value="artist@dillustration.com"
                placeholder="artist@dillustration.com"
                class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-white/20"
              />
            </div>
          </div>

          <button
            type="submit"
            class="w-full py-4 bg-[#A7ACD9] hover:bg-white text-[#161826] font-bold text-base rounded-xl transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer"
          >
            <span>Send Link</span>
            <span class="material-symbols-outlined text-xl transition-transform duration-300 group-hover:translate-x-1">
              arrow_forward
            </span>
          </button>
        </form>

        <div class="text-center pt-2">
          <a href="scr01_login_preview.html" class="text-xs font-semibold text-[#8A8FA9] hover:text-white transition-colors">
            ← Return to sign in
          </a>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full flex justify-between items-center text-xs text-[#8A8FA9] z-10 pt-4">
    <div>© 2026 dillustration. Digital Etherealism Art Collective.</div>
    <div class="flex gap-6">
      <a href="#" class="hover:text-white">Privacy</a>
      <a href="#" class="hover:text-white">Guidelines</a>
    </div>
  </footer>

  <script>
    function handleSendLink(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      alert(`Password reset magic link dispatched to ${email}! Please check your email inbox.`);
    }
  </script>

</body>
</html>
