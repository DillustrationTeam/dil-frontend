<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email OTP - dillustration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background-color: #1F2335; color: #e4e1e5; }
    h1, h2, h3, .font-h1 { font-family: 'Sora', sans-serif; }
    .glass-container {
      background: rgba(31, 35, 53, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-6 relative overflow-hidden">

  <!-- Atmospheric Background -->
  <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-[#c2c7f6]/10 rounded-full blur-[120px] animate-pulse"></div>
    <div class="absolute bottom-[-5%] right-[-5%] w-[40%] h-[40%] bg-[#A7ACD9]/5 rounded-full blur-[100px]"></div>
  </div>

  <!-- Main Verification Shell -->
  <main class="w-full max-w-xl z-10">
    
    <!-- Brand Identity Header -->
    <div class="flex flex-col items-center mb-8">
      <a href="scr05_marketplace_feed_preview.html" class="mb-2">
        <span class="text-3xl font-black font-h1 tracking-tight text-white drop-shadow-[0_0_20px_rgba(194,199,246,0.4)]">dillustration</span>
      </a>
      <p class="text-[11px] text-[#7B819F] uppercase tracking-[0.2em] font-medium">
        Digital Etherealism Collective
      </p>
    </div>

    <!-- Glassmorphic Container -->
    <div class="glass-container rounded-[28px] p-8 md:p-12 relative overflow-hidden">
      
      <div class="relative z-10">
        <h1 class="font-h1 text-3xl font-bold mb-2 text-white">Verify Your Email</h1>
        <p class="text-sm text-[#9EA4C1] mb-8 leading-relaxed">
          We have sent a 6-digit verification code to <span class="text-[#A7ACD9] font-medium">curator@ethereal.art</span>. Please enter the code below.
        </p>

        <form onsubmit="handleVerifyOtp(event)" class="space-y-6">
          <label class="text-[11px] uppercase tracking-[0.12em] text-[#7B819F] ml-1 font-semibold block">
            VERIFICATION CODE (6-DIGITS)
          </label>

          <!-- 6 OTP Inputs Grid -->
          <div class="grid grid-cols-6 gap-2.5 md:gap-3.5">
            <input type="text" maxlength="1" value="8" oninput="moveNext(this, 'otp2')" id="otp1" class="w-full h-14 md:h-16 text-center text-xl md:text-2xl font-bold font-h1 bg-[#0e0e11]/50 border border-white/10 rounded-xl text-white focus:outline-none focus:border-[#A7ACD9]" />
            <input type="text" maxlength="1" value="4" oninput="moveNext(this, 'otp3')" id="otp2" class="w-full h-14 md:h-16 text-center text-xl md:text-2xl font-bold font-h1 bg-[#0e0e11]/50 border border-white/10 rounded-xl text-white focus:outline-none focus:border-[#A7ACD9]" />
            <input type="text" maxlength="1" value="9" oninput="moveNext(this, 'otp4')" id="otp3" class="w-full h-14 md:h-16 text-center text-xl md:text-2xl font-bold font-h1 bg-[#0e0e11]/50 border border-white/10 rounded-xl text-white focus:outline-none focus:border-[#A7ACD9]" />
            <input type="text" maxlength="1" value="2" oninput="moveNext(this, 'otp5')" id="otp4" class="w-full h-14 md:h-16 text-center text-xl md:text-2xl font-bold font-h1 bg-[#0e0e11]/50 border border-white/10 rounded-xl text-white focus:outline-none focus:border-[#A7ACD9]" />
            <input type="text" maxlength="1" value="7" oninput="moveNext(this, 'otp6')" id="otp5" class="w-full h-14 md:h-16 text-center text-xl md:text-2xl font-bold font-h1 bg-[#0e0e11]/50 border border-white/10 rounded-xl text-white focus:outline-none focus:border-[#A7ACD9]" />
            <input type="text" maxlength="1" value="1" id="otp6" class="w-full h-14 md:h-16 text-center text-xl md:text-2xl font-bold font-h1 bg-[#0e0e11]/50 border border-white/10 rounded-xl text-white focus:outline-none focus:border-[#A7ACD9]" />
          </div>

          <!-- Resend Timer -->
          <div class="flex items-center justify-between text-xs text-[#9EA4C1] pt-2">
            <span>Didn't receive the code?</span>
            <button type="button" onclick="resendCode()" id="btnResend" class="text-[#A7ACD9] font-semibold hover:underline cursor-pointer">
              Resend Code (59s)
            </button>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full py-4 bg-white text-[#171A27] font-bold text-base rounded-xl transition-all duration-300 active:scale-95 mt-4 flex items-center justify-center gap-2 group cursor-pointer shadow-xl hover:bg-[#c2c7f6]"
          >
            <span>Verify & Continue</span>
            <span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1">
              arrow_forward
            </span>
          </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/10 text-center">
          <a href="scr01_register_preview.html" class="text-xs text-[#9EA4C1] hover:text-white transition-colors">
            ← Wrong email address? Sign up again
          </a>
        </div>

      </div>

    </div>

  </main>

  <script>
    function moveNext(current, nextId) {
      if (current.value.length >= 1) {
        const next = document.getElementById(nextId);
        if (next) next.focus();
      }
    }
    function resendCode() {
      alert('A new 6-digit OTP code has been sent to curator@ethereal.art');
    }
    function handleVerifyOtp(e) {
      e.preventDefault();
      alert('Email Verified Successfully! Welcome to the Dillustration Collective.');
      window.location.href = 'scr05_marketplace_feed_preview.html';
    }
  </script>

</body>
</html>
